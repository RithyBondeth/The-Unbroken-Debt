<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shadow form visual review</title>
    <link rel="stylesheet" href="/src/ui/html/base.css" />
  </head>
  <body>
    <canvas id="game" aria-label="Shadow form visual review"></canvas>
    <div id="overlay"></div>
    <nav style="position: fixed; top: 12px; left: 12px; z-index: 1000; display: flex; gap: 8px">
      <button id="forest">Forest apparition</button>
      <button id="hall">Hallway walker</button>
      <button id="under">Under-house roamer</button>
      <button id="mask">Face detail</button>
      <button id="profile">Side profile</button>
      <button id="capture">Save screenshot</button>
    </nav>
    <output
      id="review-status"
      style="
        position: fixed;
        bottom: 12px;
        left: 12px;
        z-index: 1000;
        color: #ddd;
        background: #111a;
        padding: 8px;
      "
      >Loading village…</output
    >
    <script type="module" src="./shadows.ts"></script>
  </body>
</html>
