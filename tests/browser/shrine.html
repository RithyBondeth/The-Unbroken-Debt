<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shrine and offerings visual review</title>
    <link rel="stylesheet" href="/src/ui/html/base.css" />
  </head>
  <body>
    <canvas id="game" aria-label="Shrine visual review"></canvas>
    <div id="overlay"></div>
    <nav style="position: fixed; top: 12px; left: 12px; z-index: 1000; display: flex; gap: 8px">
      <button id="shrine">Shrine</button>
      <button id="statues">Ancestral figures</button>
      <button id="details">Offering details</button>
      <button id="house">Spirit house</button>
      <button id="chicken">Chicken</button>
      <button id="packets">Leaf packets</button>
      <button id="capture">Save screenshot</button>
    </nav>
    <output
      id="review-status"
      style="
        position: fixed;
        bottom: 12px;
        left: 12px;
        z-index: 1000;
        color: #ddd;
        background: #111a;
        padding: 8px;
      "
      >Loading village…</output
    >
    <script type="module" src="./shrine.ts"></script>
  </body>
</html>
