<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Altar, desk and CP4 verification</title>
    <link rel="stylesheet" href="/src/ui/html/base.css" />
  </head>
  <body>
    <canvas id="game" aria-label="Altar, desk and CP4"></canvas>
    <div id="overlay"></div>
    <nav
      style="
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 1000;
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      "
    >
      <button id="altar">View altar key</button><button id="desk">View desk</button
      ><button id="portrait">View portrait</button>
      <button id="results-toggle">Toggle results</button>
      <small id="input-status" style="color: white; background: #100c09cc; padding: 4px"></small>
    </nav>
    <pre
      id="results"
      style="
        position: fixed;
        top: 44px;
        left: 12px;
        right: 12px;
        max-height: 40vh;
        overflow: auto;
        z-index: 1000;
        white-space: pre-wrap;
        background: #100c09dc;
        color: #eee3cb;
        padding: 12px;
        pointer-events: none;
        font-size: 12px;
      "
    ></pre>
    <script type="module" src="./desk.ts"></script>
  </body>
</html>
