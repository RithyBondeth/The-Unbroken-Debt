name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type-check, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out (fetch test-required LFS assets separately)
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Fetch character and taxi geometry for asset regression tests
        run: git lfs pull --include="public/assets/ep1/sok_corpse.glb,public/assets/ep1/neakta_shadow.glb,public/assets/ep1/phra_phum_effigy.glb,public/assets/ep1/ep1_taxi_cabin.glb,public/assets/ep1/ep1_taxi_roadside.glb" --exclude=""

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Check formatting
        run: npm run format:check
