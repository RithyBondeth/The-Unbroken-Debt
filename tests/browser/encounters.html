<!doctype html>
<html lang="en">
  <head>

    <title>Spirit and courtyard movement regression</title>
    <link rel="stylesheet" href="/src/ui/html/base.css" />
  </head>
  <body>
    <canvas id="game" aria-label="Encounter movement review"></canvas>
    <div id="overlay"></div>
    <nav
      style="
        position: fixed;
        top: 12px;
        left: 12px;
        right: 12px;
        z-index: 1000;

        flex-wrap: wrap;

      <button id="courtyard">Walk into courtyard</button>

        position: fixed;
        bottom: 12px;
        left: 12px;
        right: 12px;

        color: #ddd;
        background: #111c;
        padding: 8px;
      "
