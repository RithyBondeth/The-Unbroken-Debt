<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Episode 3 · The Drowned Village · Review</title>
    <link rel="stylesheet" href="/src/ui/html/base.css" />
    <style>
      #review {
        position: fixed;
        inset: 12px 12px auto;
        z-index: 1000;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      #review button,
      #review a {
        padding: 10px;
        background: #181613;
        color: #e6dccb;
        border: 1px solid #655b4d;
        font:
          13px Ubuntu,
          sans-serif;
        cursor: pointer;
      }
      #results {
        position: fixed;
        bottom: 12px;
        left: 12px;
        z-index: 1000;
        max-width: 90vw;
        max-height: 27vh;
        overflow: auto;
        background: #151310ed;
        color: #e6dccb;
        padding: 12px;
        font: 12px/1.5 monospace;
        white-space: pre-wrap;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <canvas id="game" aria-label="Episode 3 production scene"></canvas>
    <div id="overlay" hidden></div>
    <nav id="review" aria-label="Scene review">
      <button data-view="market">Market</button><button data-view="lok">Pa Lok</button>
      <button data-view="clinic">Clinic exterior</button
      ><button data-view="ward">Flooded ward</button>
      <button data-view="attic">Doctor’s quarters</button
      ><button data-view="vault">Cellar safe</button> <button data-view="kanha">Kanha</button
      ><button data-view="ritual">Upper deck</button> <button data-view="escape">Roof route</button
      ><button data-view="rescue">Last stilt</button>
      <button id="journey">Verify story and saves</button
      ><button id="traversal">Verify physical routes</button>
      <button id="capture">Save screenshot</button><button id="clean">Hide review controls</button>
      <a href="?stage=market">Daylight opening</a><a href="?stage=clinic">Storm clinic</a
      ><a href="?stage=purification">Mother / ritual</a>
    </nav>
    <pre id="results" role="status">Loading Episode 3 with isolated review saves…</pre>
    <script type="module" src="./drowned-village.ts"></script>
  </body>
</html>
