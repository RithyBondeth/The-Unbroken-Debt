<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Episode 1 mist and sound review</title>
    <link rel="stylesheet" href="/src/ui/html/base.css" />
    <style>
      #game {
        position: fixed;
        inset: auto 0;
        top: 50%;
        width: 100vw;
        height: 56.25vw;
        transform: translateY(-50%);
      }
      #controls {
        position: fixed;
        top: 12px;
        left: 12px;
        right: 12px;
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        z-index: 4000;
      }
      #status {
        position: fixed;
        bottom: 12px;
        left: 12px;
        background: #111d;
        color: #ddd;
        padding: 10px;
        z-index: 4000;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <canvas id="game" aria-label="Mist and sound review"></canvas>
    <div id="overlay"></div>
    <nav id="controls" aria-label="Atmosphere review controls"></nav>
    <output id="status">Loading production village…</output>
    <script type="module" src="./atmosphere.ts"></script>
  </body>
</html>
