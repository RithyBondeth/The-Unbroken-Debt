<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Under-house hunt verification</title>
    <link rel="stylesheet" href="/src/ui/html/base.css" />
  </head>
  <body>
    <canvas id="game" aria-label="Under-house hunt"></canvas>
    <div id="overlay"></div>
    <nav style="position: fixed; top: 12px; left: 12px; z-index: 1000; display: flex; gap: 6px">
      <button id="jar">View jar</button><button id="roamer">View roamer</button
      ><button id="results-toggle">Toggle results</button>
    </nav>
    <pre
      id="results"
      style="
        position: fixed;
        top: 44px;
        left: 12px;
        right: 12px;
        max-height: 40vh;
        overflow: auto;
        z-index: 1000;
        white-space: pre-wrap;
        background: #100c09dc;
        color: #eee3cb;
        padding: 12px;
        pointer-events: none;
        font-size: 12px;
      "
    ></pre>
    <script type="module" src="./hunt.ts"></script>
  </body>
</html>
